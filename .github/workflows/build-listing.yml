name: Build Repo Listing

# Generates index.json from the GitHub releases of the repositories in
# source.json, builds the landing page and deploys both to GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: main
    paths-ignore:
      - README.md

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate listing and build site
        run: pnpm build
        env:
          # Raises the GitHub API rate limit for reading releases
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub Pages serves project sites from /<repo-name>
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
